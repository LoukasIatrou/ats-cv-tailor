name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18.x", "20.x"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ats-cv-tailor:ci .

      - name: Smoke test — compile the bundled example CV with no runtime network
        run: |
          docker run -d --name smoke --network none \
            -v "${{ github.workspace }}/examples:/cv" ats-cv-tailor:ci /cv/sample-cv.tex
          for i in $(seq 1 15); do
            docker exec smoke test -f /cv/.build/sample-cv.pdf && break
            sleep 1
          done
          docker exec smoke test -f /cv/.build/sample-cv.pdf || { docker logs smoke; exit 1; }
          docker rm -f smoke
